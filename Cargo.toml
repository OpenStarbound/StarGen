[package]
name = "stargen"
version = "0.1.0"
edition = "2024"
authors = ["kae"]

[dependencies]
mimalloc = { version = "0.1.52" }
indexmap = "2.14.1"
arc-swap = "1.9.2"
anyhow = "1.0.104"
compact_str = { version = "0.10.0", features = ["serde"] }
tracing = "0.1.44"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["raw_value"] }
infer = "0.22.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
phf = { version = "0.14.0", features = ["macros"] }
clap = { version = "4.6.7", features = ["derive"] }
foldhash = "0.2.0"

[profile.release]
debug = "line-tables-only"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "generate"
harness = false
